help.text=<b>Jak mnie używać</b>\n\n1️⃣ Wyślij lub przekaż dowolny tekst. {1} — poprawię; inny język — przetłumaczę na {1}. Języki, na które często tłumaczysz, też poprawiam zamiast tłumaczyć.\n2️⃣ Przyciski pod wynikiem: kopiuj, przetłumacz na inny język, zmień styl lub skróć, zobacz, co zmieniono.\n3️⃣ Edytowałeś wiadomość? Zaktualizuję odpowiedź.\n\n💡 W dowolnym czacie wpisz <code>@{0} twój tekst</code> i wyślij poprawioną wersję bez wychodzenia z rozmowy.\n\n/language — domyślny język

