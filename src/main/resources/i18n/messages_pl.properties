bot.description=✍️ Wyślij mi dowolną wiadomość — poprawię gramatykę i ortografię albo przetłumaczę ją na potrzebny język.\n\n🔄 Inna wersja, 🎩 formalnie, 😎 swobodnie lub ✂️ krócej — jednym dotknięciem.\n💡 Zobacz, co zmieniono i dlaczego.\n⚡ Działa w każdym czacie: wpisz @{0} i swój tekst.

