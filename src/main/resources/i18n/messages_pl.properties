
welcome.caption=👋 Cześć, {0}!\n\nJestem Rewryt, twój kieszonkowy redaktor. Po prostu wyślij mi dowolną wiadomość:\n• {1} → poprawię błędy\n• inny język → przetłumaczę na {1}\n\nPod każdym wynikiem możesz jednym dotknięciem przetłumaczyć go na inny język, zmienić styl albo skrócić.\n\nZmień domyślny język: /language
welcome.back=👋 Witaj ponownie, {0}!\n\nDomyślny język: {1}\n\nWyślij mi dowolny tekst, a ja się nim zajmę.

