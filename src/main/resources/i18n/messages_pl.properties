help.text=<b>Jak mnie używać</b>\n\n1️⃣ Wyślij lub przekaż dowolny tekst — dostaniesz dopracowaną wersję.\n2️⃣ Przyciski pod wynikiem: inna wersja, inny styl lub język albo co zmieniono.\n3️⃣ Edytowałeś wiadomość? Zaktualizuję odpowiedź.\n\n💡 W dowolnym czacie wpisz <code>@{0} twój tekst</code> i wyślij poprawioną wersję bez wychodzenia z rozmowy.\n\n/settings — tryb, język, styl\n/language — język wyniku
tip.inline=💡 Wskazówka: w dowolnym czacie wpisz <code>@{0} twój tekst</code>, aby poprawić go w locie.

