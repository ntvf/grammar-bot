
welcome.caption=👋 Привет, {0}!\n\nЯ Rewryt, твой карманный редактор. Просто пришли мне любое сообщение:\n• {1} → исправлю ошибки\n• другой язык → переведу на {1}\n\nПод каждым результатом можно в одно касание перевести на другой язык, сменить стиль или сократить текст.\n\nСменить язык по умолчанию: /language
