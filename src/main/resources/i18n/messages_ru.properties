help.text=<b>Как мной пользоваться</b>\n\n1️⃣ Пришли или перешли любой текст. {1} — исправлю; другой язык — переведу на {1}. Языки, на которые ты часто переводишь, я тоже исправляю, а не перевожу.\n2️⃣ Кнопки под результатом: копировать, перевести на другой язык, сменить стиль или сократить, посмотреть, что изменено.\n3️⃣ Отредактировал сообщение? Я обновлю ответ.\n\n💡 В любом чате набери <code>@{0} твой текст</code> — и отправь исправленный вариант, не выходя из разговора.\n\n/language — язык по умолчанию

