help.text=<b>Как мной пользоваться</b>\n\n1️⃣ Пришли или перешли любой текст — получи исправленный вариант.\n2️⃣ Кнопки под результатом: другой вариант, другой стиль или язык, или что изменено.\n3️⃣ Отредактировал сообщение? Я обновлю ответ.\n\n💡 В любом чате набери <code>@{0} твой текст</code> — и отправь исправленный вариант, не выходя из разговора.\n\n/settings — режим, язык, стиль\n/language — язык результата
tip.inline=💡 Совет: в любом чате набери <code>@{0} твой текст</code>, чтобы исправить его на лету.

