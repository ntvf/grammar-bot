help.text=<b>Nasıl kullanılır</b>\n\n1️⃣ Herhangi bir metni gönder ya da ilet — düzeltilmiş halini al.\n2️⃣ Sonucun altındaki düğmeler: başka bir versiyon, başka bir üslup ya da dil veya neler değişti.\n3️⃣ Mesajını mı düzenledin? Cevabımı güncellerim.\n\n💡 Herhangi bir sohbette <code>@{0} metnin</code> yaz ve sohbetten çıkmadan düzeltilmiş halini gönder.\n\n/settings — mod, dil, üslup\n/language — sonuç dili
