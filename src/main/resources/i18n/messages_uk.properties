help.text=<b>Як мною користуватися</b>\n\n1️⃣ Надішли або перешли будь-який текст — отримай виправлений варіант.\n2️⃣ Кнопки під результатом: інший варіант, інший стиль чи мова, або що змінено.\n3️⃣ Відредагував повідомлення? Я оновлю відповідь.\n\n💡 У будь-якому чаті набери <code>@{0} твій текст</code> — і надішли виправлений варіант, не виходячи з розмови.\n\n/settings — режим, мова, стиль\n/language — мова результату
