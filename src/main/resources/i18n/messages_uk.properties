help.text=<b>Як мною користуватися</b>\n\n1️⃣ Надішли або перешли будь-який текст. {1} — виправлю; інша мова — перекладу на {1}. Мови, на які ти часто перекладаєш, я теж виправляю, а не перекладаю.\n2️⃣ Кнопки під результатом: копіювати, перекласти іншою мовою, змінити стиль чи скоротити, подивитися, що змінено.\n3️⃣ Відредагував повідомлення? Я оновлю відповідь.\n\n💡 У будь-якому чаті набери <code>@{0} твій текст</code> — і надішли виправлений варіант, не виходячи з розмови.\n\n/language — мова за замовчуванням

