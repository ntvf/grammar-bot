
welcome.caption=👋 Olá, {0}!\n\nSou o Rewryt, o teu editor de bolso. Envia-me qualquer mensagem:\n• {1} → corrijo os erros\n• outro idioma → traduzo para {1}\n\nPor baixo de cada resultado podes traduzi-lo para outro idioma com um toque, mudar o estilo ou encurtá-lo.\n\nMudar o idioma predefinido: /language
