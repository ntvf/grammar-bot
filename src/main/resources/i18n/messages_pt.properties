help.text=<b>Como me usar</b>\n\n1️⃣ Envia ou reencaminha qualquer texto — recebe uma versão melhorada.\n2️⃣ Botões por baixo do resultado: outra versão, outro estilo ou idioma, ou o que mudou.\n3️⃣ Editaste a mensagem? Eu atualizo a resposta.\n\n💡 Em qualquer chat escreve <code>@{0} o teu texto</code> e envia a versão corrigida sem sair da conversa.\n\n/settings — modo, idioma, estilo\n/language — idioma do resultado
tip.inline=💡 Dica: em qualquer chat escreve <code>@{0} o teu texto</code> para o corrigir na hora.

