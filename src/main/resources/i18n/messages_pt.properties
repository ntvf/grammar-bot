help.text=<b>Como me usar</b>\n\n1️⃣ Envia ou reencaminha qualquer texto. {1}: corrijo; outro idioma: traduzo para {1}. Os idiomas para os quais traduzes com frequência também são corrigidos em vez de traduzidos.\n2️⃣ Botões por baixo do resultado: copiar, traduzir para outro idioma, mudar o estilo ou encurtar, ver o que mudou.\n3️⃣ Editaste a mensagem? Eu atualizo a resposta.\n\n💡 Em qualquer chat escreve <code>@{0} o teu texto</code> e envia a versão corrigida sem sair da conversa.\n\n/language — idioma predefinido

