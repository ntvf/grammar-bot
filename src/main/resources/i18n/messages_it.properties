help.text=<b>Come usarmi</b>\n\n1️⃣ Invia o inoltra qualsiasi testo e ricevi una versione curata.\n2️⃣ Pulsanti sotto il risultato: un’altra versione, un altro stile o lingua, o cosa è cambiato.\n3️⃣ Hai modificato il messaggio? Aggiorno la mia risposta.\n\n💡 In qualsiasi chat scrivi <code>@{0} il tuo testo</code> e invia la versione corretta senza lasciare la conversazione.\n\n/settings — modalità, lingua, stile\n/language — lingua del risultato
tip.inline=💡 Suggerimento: in qualsiasi chat scrivi <code>@{0} il tuo testo</code> per correggerlo al volo.

