help.text=<b>Come usarmi</b>\n\n1️⃣ Invia o inoltra qualsiasi testo. {1}: lo correggo; un’altra lingua: lo traduco in {1}. Le lingue in cui traduci spesso le correggo invece di tradurle.\n2️⃣ Pulsanti sotto il risultato: copia, traduci in un’altra lingua, cambia stile o accorcia, guarda cosa è cambiato.\n3️⃣ Hai modificato il messaggio? Aggiorno la mia risposta.\n\n💡 In qualsiasi chat scrivi <code>@{0} il tuo testo</code> e invia la versione corretta senza lasciare la conversazione.\n\n/language — lingua predefinita

