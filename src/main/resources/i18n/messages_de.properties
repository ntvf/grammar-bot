help.text=<b>So funktioniere ich</b>\n\n1️⃣ Schick oder leite einen beliebigen Text weiter — du bekommst eine verbesserte Version zurück.\n2️⃣ Buttons unter dem Ergebnis: andere Version, anderer Stil oder andere Sprache, oder was geändert wurde.\n3️⃣ Nachricht bearbeitet? Ich aktualisiere meine Antwort.\n\n💡 Tippe in jedem Chat <code>@{0} dein Text</code> — und sende die korrigierte Version, ohne das Gespräch zu verlassen.\n\n/settings — Modus, Sprache, Stil\n/language — Zielsprache
