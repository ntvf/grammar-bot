help.text=<b>So funktioniere ich</b>\n\n1️⃣ Schick oder leite einen beliebigen Text weiter. {1} — ich korrigiere; andere Sprache — ich übersetze in {1}. Sprachen, in die du oft übersetzt, korrigiere ich ebenfalls, statt sie zu übersetzen.\n2️⃣ Buttons unter dem Ergebnis: kopieren, in eine andere Sprache übersetzen, Stil ändern oder kürzen, sehen, was geändert wurde.\n3️⃣ Nachricht bearbeitet? Ich aktualisiere meine Antwort.\n\n💡 Tippe in jedem Chat <code>@{0} dein Text</code> — und sende die korrigierte Version, ohne das Gespräch zu verlassen.\n\n/language — Standardsprache

