help.text=<b>How to use me</b>\n\n1️⃣ Send or forward any text. {1} — I fix it; another language — I translate it into {1}. Languages you often translate into get fixed too, not translated.\n2️⃣ Buttons under the result: copy, translate into another language, change the style or make it shorter, see what changed.\n3️⃣ Edited your message? I’ll update my answer.\n\n💡 In any chat type <code>@{0} your text</code> — and send the fixed version without leaving the conversation.\n\n/language — default language

