bot.description=✍️ Write the way you think — send it the way you mean it.\n\nSend me any message and I’ll fix the grammar or translate it into the language you need, without losing your voice.\n\n🎩 Formal, 😎 casual or ✂️ shorter — one tap\n🌐 7 result languages\n💡 See what changed and why\n⚡ Works in any chat: type @{0} and your text\n\nTap Start and send your first message.

