help.text=<b>How to use me</b>\n\n1️⃣ Send or forward any text — get a polished version back.\n2️⃣ Buttons under the result: another version, a different style or language, or what changed.\n3️⃣ Edited your message? I’ll update my answer.\n\n💡 In any chat type <code>@{0} your text</code> — and send the fixed version without leaving the conversation.\n\n/settings — mode, language, style\n/language — result language
