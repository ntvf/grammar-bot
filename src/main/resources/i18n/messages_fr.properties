help.text=<b>Comment m’utiliser</b>\n\n1️⃣ Envoie ou transfère n’importe quel texte — reçois une version soignée.\n2️⃣ Boutons sous le résultat : autre version, autre style ou langue, ou ce qui a changé.\n3️⃣ Tu as modifié ton message ? Je mets ma réponse à jour.\n\n💡 Dans n’importe quel chat, tape <code>@{0} ton texte</code> et envoie la version corrigée sans quitter la conversation.\n\n/settings — mode, langue, style\n/language — langue du résultat
tip.inline=💡 Astuce : dans n’importe quel chat, tape <code>@{0} ton texte</code> pour le corriger à la volée.

