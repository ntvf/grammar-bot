
welcome.caption=👋 Salut, {0} !\n\nJe suis Rewryt, ton correcteur de poche. Envoie-moi n’importe quel message :\n• {1} → je corrige les fautes\n• autre langue → je le traduis en {1}\n\nSous chaque résultat, tu peux le traduire dans une autre langue en un geste, changer le style ou le raccourcir.\n\nChanger la langue par défaut : /language
