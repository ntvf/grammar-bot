help.text=<b>Comment m’utiliser</b>\n\n1️⃣ Envoie ou transfère n’importe quel texte. {1} : je le corrige ; autre langue : je le traduis en {1}. Les langues vers lesquelles tu traduis souvent, je les corrige aussi au lieu de les traduire.\n2️⃣ Boutons sous le résultat : copier, traduire dans une autre langue, changer le style ou raccourcir, voir ce qui a changé.\n3️⃣ Tu as modifié ton message ? Je mets ma réponse à jour.\n\n💡 Dans n’importe quel chat, tape <code>@{0} ton texte</code> et envoie la version corrigée sans quitter la conversation.\n\n/language — langue par défaut

