help.text=<b>Cómo usarme</b>\n\n1️⃣ Envía o reenvía cualquier texto y recibe una versión pulida.\n2️⃣ Botones bajo el resultado: otra versión, otro estilo o idioma, o qué cambió.\n3️⃣ ¿Editaste tu mensaje? Actualizaré mi respuesta.\n\n💡 En cualquier chat escribe <code>@{0} tu texto</code> y envía la versión corregida sin salir de la conversación.\n\n/settings — modo, idioma, estilo\n/language — idioma del resultado
tip.inline=💡 Consejo: en cualquier chat escribe <code>@{0} tu texto</code> para corregirlo al momento.

