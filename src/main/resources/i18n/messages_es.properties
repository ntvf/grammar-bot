help.text=<b>Cómo usarme</b>\n\n1️⃣ Envía o reenvía cualquier texto. {1}: lo corrijo; otro idioma: lo traduzco a {1}. Los idiomas a los que traduces a menudo también los corrijo en vez de traducirlos.\n2️⃣ Botones bajo el resultado: copiar, traducir a otro idioma, cambiar el estilo o acortar, ver qué cambió.\n3️⃣ ¿Editaste tu mensaje? Actualizaré mi respuesta.\n\n💡 En cualquier chat escribe <code>@{0} tu texto</code> y envía la versión corregida sin salir de la conversación.\n\n/language — idioma predeterminado

